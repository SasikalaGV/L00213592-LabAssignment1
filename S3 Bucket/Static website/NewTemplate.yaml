AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 static website hosting'

Parameters:
    StudentName:
      Type: String
      Description: 'Student Name'
      Default: 'Sasikala Varatharajan'
    StudentNumber:
      Type: String
      Description: 'Student Number'
      Default: 'L00213592'
    MyBucketName:
      Type: String
      Description: 'Enter the Bucket Name'
      Default: 'my-static-website-sasiv'

Resources:
  MyS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: 
        Ref: MyBucketName
      WebsiteConfiguration:
        IndexDocument: 'index.html'
      

  S3BucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: 
        Ref: MyS3Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
            - Action: 's3:GetObject'
              Effect: Allow
              Resource: 
                sub: '${MyS3Bucket.Arn}/*'
              Principal: '*'
            
Outputs:
  WebsiteBucketName:
    Description: Name of the S3 bucket hosting the website.
    Value: 
      Ref: MyS3Bucket

  WebsiteURL:
    Description: 'S3 static website endpoint'
    Value: !GetAtt MyS3Bucket.WebsiteURL

