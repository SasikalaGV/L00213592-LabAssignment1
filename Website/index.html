<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name and Number</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      background: white;
      padding: 32px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h1 { margin: 0 0 24px; color: #243447; }
    p { font-size: 1.15rem; margin: 12px 0; color: #333; }
    strong { color: #111827; }
  </style>
</head>
<body>
  <main class="card">
    <h1>CloudFormation Lab</h1>
    <p><strong>Name:</strong> Sasikala Varatharajan</p>
    <p><strong>Number:</strong> L00213592</p>
  </main>
</body>
</html>
